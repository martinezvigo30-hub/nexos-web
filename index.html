<!DOCTYPE html>
<html lang="es">
<head>
  <!--
    Si algún día se sirve la app en una subcarpeta (y no en la raíz del
    dominio), hay que compilar con:  flutter build web --base-href /ruta/
    En Netlify, en la raíz, esto se queda como está.
  -->
  <base href="/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="NEXoS — sistema privado de comunicación: chat, tiendas y pedidos.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
  <meta name="theme-color" content="#0D1117">

  <!-- iOS -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="NEXoS">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>NEXoS</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background-color: #0D1117;
    }

    /*
      Pantalla de carga. Una app Flutter web tarda unos segundos en
      descargarse la primera vez; sin esto el usuario ve una página en
      blanco y cree que está rota. Se borra sola cuando Flutter arranca.
    */
    #cargando {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #1C2A3F 0%, #0D1117 100%);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      transition: opacity .35s ease;
      z-index: 9999;
    }

    #cargando.oculto { opacity: 0; pointer-events: none; }

    #cargando img {
      width: 88px;
      height: 88px;
      border-radius: 28px;
      box-shadow: 0 8px 28px rgba(47, 129, 247, .45);
    }

    #cargando .marca {
      margin-top: 18px;
      color: #FFFFFF;
      font-size: 22px;
      font-weight: 800;
      letter-spacing: 3px;
    }

    #cargando .pie {
      margin-top: 6px;
      color: rgba(255, 255, 255, .38);
      font-size: 12px;
    }

    #cargando .barra {
      margin-top: 22px;
      width: 160px;
      height: 3px;
      border-radius: 2px;
      background: rgba(255, 255, 255, .10);
      overflow: hidden;
    }

    #cargando .barra span {
      display: block;
      width: 40%;
      height: 100%;
      border-radius: 2px;
      background: linear-gradient(90deg, #2F81F7, #58D5FF);
      animation: correr 1.1s ease-in-out infinite;
    }

    @keyframes correr {
      0%   { transform: translateX(-100%); }
      100% { transform: translateX(300%); }
    }
  </style>
</head>
<body>
  <div id="cargando">
    <img src="icons/Icon-192.png" alt="NEXoS">
    <div class="marca">NEXoS</div>
    <div class="pie">Cargando...</div>
    <div class="barra"><span></span></div>
  </div>

  <script>
    // Flutter avisa cuando ya pintó el primer frame; ahí se retira el velo.
    window.addEventListener('flutter-first-frame', function () {
      var velo = document.getElementById('cargando');
      if (!velo) return;
      velo.classList.add('oculto');
      setTimeout(function () { velo.remove(); }, 400);
    });
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
